<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" role="img" aria-labelledby="title desc">
  <title id="title">Current Robot Operation with OpenFaaS PID</title>
  <desc id="desc">UML-style activity diagram for the current stable robot baseline using OpenFaaS PID requests.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .lane-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .node { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
      .io { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
      .warn { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
      .store { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
      .decision { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 2; }
      .text { font: 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, sans-serif; fill: #334155; }
      .edge { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .edge-soft { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-soft); }
      .label { font: 13px Arial, sans-serif; fill: #475569; }
      .startend { fill: #0f172a; stroke: #0f172a; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="980"/>
  <text x="640" y="38" text-anchor="middle" class="lane-title">Current Robot Operation with OpenFaaS PID</text>

  <rect class="lane" x="40" y="70" width="520" height="860" rx="8"/>
  <text x="300" y="102" text-anchor="middle" class="lane-title">Robot pod on gamma</text>

  <rect class="lane" x="610" y="70" width="300" height="860" rx="8"/>
  <text x="760" y="102" text-anchor="middle" class="lane-title">OpenFaaS pidserver on beta</text>

  <rect class="lane" x="960" y="70" width="280" height="860" rx="8"/>
  <text x="1100" y="102" text-anchor="middle" class="lane-title">InfluxDB and Grafana</text>

  <circle class="startend" cx="300" cy="135" r="12"/>
  <rect class="node" x="170" y="165" width="260" height="58" rx="8"/>
  <text class="text" x="300" y="189" text-anchor="middle">Start robot container</text>
  <text class="small" x="300" y="210" text-anchor="middle">./myapp 100 100 true</text>

  <rect class="node" x="150" y="255" width="300" height="72" rx="8"/>
  <text class="text" x="300" y="280" text-anchor="middle">Initialize runtime state</text>
  <text class="small" x="300" y="302" text-anchor="middle">Influx writer, PID x/psi/phi, debug</text>

  <polygon class="decision" points="300,365 410,425 300,485 190,425"/>
  <text class="text" x="300" y="418" text-anchor="middle">Frame due?</text>
  <text class="small" x="300" y="440" text-anchor="middle">delta_time &gt; 1/FPS</text>

  <polygon class="decision" points="300,525 420,585 300,645 180,585"/>
  <text class="text" x="300" y="579" text-anchor="middle">Still balanced?</text>
  <text class="small" x="300" y="601" text-anchor="middle">abs(phi) &lt;= 0.785</text>

  <rect class="node" x="95" y="690" width="250" height="64" rx="8"/>
  <text class="text" x="220" y="716" text-anchor="middle">Advance dynamics</text>
  <text class="small" x="220" y="738" text-anchor="middle">uses previous motor forces</text>

  <rect class="node" x="95" y="790" width="250" height="64" rx="8"/>
  <text class="text" x="220" y="816" text-anchor="middle">Start correction worker</text>
  <text class="small" x="220" y="838" text-anchor="middle">main waits up to 100 ms</text>

  <rect class="warn" x="375" y="690" width="145" height="64" rx="8"/>
  <text class="text" x="447.5" y="715" text-anchor="middle">Set sentinel</text>
  <text class="small" x="447.5" y="737" text-anchor="middle">phi = +/-2.03</text>

  <rect class="io" x="650" y="675" width="220" height="70" rx="8"/>
  <text class="text" x="760" y="700" text-anchor="middle">Receive /pid JSON</text>
  <text class="small" x="760" y="722" text-anchor="middle">x, psi, phi requests</text>

  <rect class="io" x="650" y="790" width="220" height="70" rx="8"/>
  <text class="text" x="760" y="816" text-anchor="middle">Return PID JSON</text>
  <text class="small" x="760" y="838" text-anchor="middle">error, P/I/D, PID result</text>

  <polygon class="decision" points="450,790 555,840 450,890 345,840"/>
  <text class="text" x="450" y="834" text-anchor="middle">Finished</text>
  <text class="small" x="450" y="854" text-anchor="middle">before timeout?</text>

  <rect class="node" x="95" y="880" width="180" height="58" rx="8"/>
  <text class="text" x="185" y="905" text-anchor="middle">Keep new PID</text>
  <text class="small" x="185" y="926" text-anchor="middle">update F[0], F[1]</text>

  <rect class="warn" x="355" y="905" width="190" height="58" rx="8"/>
  <text class="text" x="450" y="930" text-anchor="middle">Restore old state</text>
  <text class="small" x="450" y="951" text-anchor="middle">timeout_happened = true</text>

  <rect class="store" x="1000" y="620" width="200" height="72" rx="8"/>
  <text class="text" x="1100" y="645" text-anchor="middle">Write angle point</text>
  <text class="small" x="1100" y="667" text-anchor="middle">value, timeout, delta_time</text>

  <rect class="store" x="1000" y="745" width="200" height="72" rx="8"/>
  <text class="text" x="1100" y="770" text-anchor="middle">Grafana panels</text>
  <text class="small" x="1100" y="792" text-anchor="middle">angle and timeout</text>

  <circle class="startend" cx="300" cy="910" r="16" fill="none"/>
  <circle class="startend" cx="300" cy="910" r="9"/>

  <path class="edge" d="M300 147 L300 165"/>
  <path class="edge" d="M300 223 L300 255"/>
  <path class="edge" d="M300 327 L300 365"/>
  <path class="edge" d="M300 485 L300 525"/>
  <path class="edge" d="M235 618 L220 690"/>
  <path class="edge" d="M220 754 L220 790"/>
  <path class="edge-soft" d="M345 822 C470 780 555 720 650 710"/>
  <path class="edge-soft" d="M760 745 L760 790"/>
  <path class="edge-soft" d="M650 825 C575 825 535 830 555 840"/>
  <path class="edge" d="M345 840 L275 900"/>
  <path class="edge" d="M555 840 L450 905"/>
  <path class="edge" d="M382 618 L447 690"/>
  <path class="edge" d="M520 722 C725 705 840 650 1000 656"/>
  <path class="edge" d="M275 910 C600 910 820 810 1000 781"/>
  <path class="edge" d="M545 934 C740 925 880 805 1000 781"/>
  <path class="edge" d="M1100 692 L1100 745"/>
  <path class="edge-soft" d="M1000 781 C790 735 610 510 410 425"/>
  <path class="edge-soft" d="M190 425 C110 430 100 330 150 290"/>

  <text class="label" x="335" y="515">yes</text>
  <text class="label" x="408" y="610">no</text>
  <text class="label" x="242" y="650">balanced</text>
  <text class="label" x="363" y="866">yes</text>
  <text class="label" x="525" y="895">no</text>
  <text class="label" x="118" y="405">no: spin</text>
</svg>
